[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlwp-data-loaders"
dynamic = ["version"]
description = "Loader package for opening datasets before mlwp-data-specs validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "xarray",
  "loguru",
  "fsspec",
  "s3fs",
  "zarr>2,<3",
  "h5netcdf",
  "h5py",
  "mlwp-data-specs",
  "dask>=2026.1.2",
]

[tool.isort]
profile = "black"

[project.optional-dependencies]
ifs = [
  "cfgrib",
  "eccodeslib",
]
test = [
  "pytest>=8.0.0",
  "certifi>=2021.10.8",
]

[project.scripts]
"mlwp.load_and_validate_dataset" = "mlwp_data_loaders.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: marks tests that require network access (e.g. fetching sample data from object storage)",
]

[tool.uv.sources]
mlwp-data-specs = { git = "https://github.com/mlwp-tools/mlwp-data-specs", rev = "059f382" }

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ipython>=9.11.0",
    "pytest>=9.0.2",
    "pooch>=1.9.0",
]
test = [
    "pooch",
    "cfgrib",
]
